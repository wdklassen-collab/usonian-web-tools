  <style>
    :root{--walnut:#4b2e15;--copper:#c16e36;--paper:#fffdf8;--ink:#2e2e2e;--muted:#6d675f}

    main{padding:24px 18px 40px}

    a.secondary{background:#555}

    iframe{display:block;width:100%;height:78vh;min-height:620px;border:1px solid #c9c1b5;border-radius:8px;background:#fff}
