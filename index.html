<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Usonian Fretboard Generator</title>
<style>
:root{--walnut:#4B2E15;--copper:#C16E36;--tan:#E6D5B8;--charcoal:#2E2E2E;--paper:#fffdf8}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--charcoal);background:#f4f1ea}
header{background:var(--walnut);color:#fff;padding:18px 22px;border-bottom:5px solid var(--copper)}
header h1{margin:0;font-size:1.45rem}
header p{margin:6px 0 0}
main{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:18px;max-width:1400px;margin:auto;padding:18px}
.panel{background:var(--paper);border:1px solid #d4cec2;border-radius:8px;padding:18px}
.field{display:grid;grid-template-columns:1fr 130px;align-items:center;gap:10px;margin-bottom:12px}
label{font-weight:700;font-size:.93rem}
input,select,button{font:inherit;border:1px solid #aaa;border-radius:5px;padding:8px 9px}
button{border:none;color:#fff;background:var(--copper);cursor:pointer;font-weight:700;padding:11px 14px}
button.secondary{background:var(--charcoal)}
.buttons{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}
.check{display:flex;gap:8px;align-items:center;margin:9px 0}
.check input{width:auto}
#message{min-height:23px;margin-top:11px;font-weight:700}
#message.ok{color:#27632a}
#message.error{color:#9b1c1c}
.note{margin-top:15px;padding:11px;background:var(--tan);border-radius:5px;font-size:.84rem;line-height:1.45}
.summary{display:grid;grid-template-columns:repeat(4,minmax(100px,1fr));gap:8px;margin-bottom:12px}
.summary div{background:#f7f4ed;border-left:4px solid var(--copper);padding:8px 10px}
.summary small{display:block;color:#666}
.summary strong{display:block;margin-top:3px}
#previewWrap{min-height:720px;overflow:auto;border:1px solid #ccc;border-radius:6px;background:#fff}
#preview{display:block;width:100%;min-width:500px;min-height:700px}
@media(max-width:850px){main{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
<h1>USONIAN FRETBOARD GENERATOR</h1>
<p>Create a fretboard outline and true single-line fret slots for Easel.</p>
</header>

<main>
<section class="panel">
<div class="field"><label for="units">Units</label><select id="units"><option value="in">Inches</option><option value="mm">Millimeters</option></select></div>
<div class="field"><label for="scale">Scale length</label><input id="scale" type="number" min="1" step="0.001" value="25.400"></div>
<div class="field"><label for="nutWidth">Nut width</label><input id="nutWidth" type="number" min="0.1" step="0.001" value="1.750"></div>
<div class="field"><label for="width14">Width at 14th fret</label><input id="width14" type="number" min="0.1" step="0.001" value="2.125"></div>
<div class="field"><label for="frets">Number of frets</label><input id="frets" type="number" min="1" max="36" step="1" value="20"></div>
<div class="field"><label for="extension">Extension past last fret</label><input id="extension" type="number" min="0" step="0.001" value="0.250"></div>
<div class="field"><label for="overrun">Fret-line overrun per side</label><input id="overrun" type="number" min="0" step="0.001" value="0.030"></div>

<div class="check"><input id="centerline" type="checkbox" checked><label for="centerline">Include centerline</label></div>
<div class="check"><input id="nutline" type="checkbox" checked><label for="nutline">Include nut line</label></div>

<div class="buttons">
<button id="generate">Generate</button>
<button id="download" class="secondary">Download SVG</button>
</div>

<div id="message"></div>
<div class="note">Each fret is exported as a single open SVG line. There is no fret-slot width input. The cutter diameter determines the finished groove width in Easel.</div>
</section>

<section class="panel">
<div class="summary">
<div><small>12th fret</small><strong id="s12">—</strong></div>
<div><small>14th fret</small><strong id="s14">—</strong></div>
<div><small>Board length</small><strong id="sLength">—</strong></div>
<div><small>End width</small><strong id="sEndWidth">—</strong></div>
</div>
<div id="previewWrap"><svg id="preview" xmlns="http://www.w3.org/2000/svg"></svg></div>
</section>
</main>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
let lastSvg = "";

function factor(){ return $("units").value === "in" ? 25.4 : 1; }
function val(id){ return Number($(id).value); }
function fretPos(scale,n){ return scale*(1-Math.pow(2,-n/12)); }

function widthAt(pos,nut,width14,fret14){
  if(Math.abs(width14-nut)<1e-9) return nut;
  return nut + (width14-nut)*(pos/fret14);
}

function display(mm){
  const inches=$("units").value==="in";
  const n=inches?mm/25.4:mm;
  return n.toFixed(inches?4:2)+" "+(inches?"in":"mm");
}

function params(){
  const f=factor();
  const p={
    scale:val("scale")*f,
    nut:val("nutWidth")*f,
    width14:val("width14")*f,
    frets:Math.round(val("frets")),
    extension:val("extension")*f,
    overrun:val("overrun")*f,
    centerline:$("centerline").checked,
    nutline:$("nutline").checked
  };

  if(![p.scale,p.nut,p.width14,p.extension,p.overrun].every(Number.isFinite))
    throw new Error("All dimensions must be valid numbers.");
  if(p.scale<=0||p.nut<=0||p.width14<=0)
    throw new Error("Scale length and widths must be greater than zero.");
  if(!Number.isInteger(p.frets)||p.frets<1||p.frets>36)
    throw new Error("Number of frets must be a whole number from 1 to 36.");
  if(p.width14<p.nut)
    throw new Error("Width at the 14th fret cannot be less than the nut width.");
  if(p.extension<0||p.overrun<0)
    throw new Error("Extension and overrun cannot be negative.");

  return p;
}

function buildSvg(p){
  const f14=fretPos(p.scale,14);
  const last=fretPos(p.scale,p.frets);
  const length=last+p.extension;
  const endWidth=widthAt(length,p.nut,p.width14,f14);

  const margin=Math.max(12,endWidth*.3);
  const vw=endWidth+margin*2;
  const vh=length+margin*2;
  const cx=vw/2;
  const y0=margin;
  const y1=y0+length;

  const nl=cx-p.nut/2, nr=cx+p.nut/2;
  const el=cx-endWidth/2, er=cx+endWidth/2;

  let frets="";
  for(let n=1;n<=p.frets;n++){
    const pos=fretPos(p.scale,n);
    const y=y0+pos;
    const w=widthAt(pos,p.nut,p.width14,f14)+p.overrun*2;
    const x1=cx-w/2, x2=cx+w/2;
    frets += `<line id="FRET_${n}" x1="${x1.toFixed(4)}" y1="${y.toFixed(4)}" x2="${x2.toFixed(4)}" y2="${y.toFixed(4)}"/>\n`;
  }

  const center=p.centerline
    ? `<line id="CENTERLINE" x1="${cx.toFixed(4)}" y1="${y0.toFixed(4)}" x2="${cx.toFixed(4)}" y2="${y1.toFixed(4)}"/>`
    : "";

  const nutline=p.nutline
    ? `<line id="NUT_LINE" x1="${nl.toFixed(4)}" y1="${y0.toFixed(4)}" x2="${nr.toFixed(4)}" y2="${y0.toFixed(4)}"/>`
    : "";

  const svg=`<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${vw.toFixed(4)}mm" height="${vh.toFixed(4)}mm" viewBox="0 0 ${vw.toFixed(4)} ${vh.toFixed(4)}">
  <g id="FRETBOARD_OUTLINE" fill="none" stroke="#000000" stroke-width="0.01">
    <path d="M ${nl.toFixed(4)} ${y0.toFixed(4)} L ${nr.toFixed(4)} ${y0.toFixed(4)} L ${er.toFixed(4)} ${y1.toFixed(4)} L ${el.toFixed(4)} ${y1.toFixed(4)} Z"/>
  </g>
  <g id="FRET_LINES" fill="none" stroke="#000000" stroke-width="0.01" stroke-linecap="butt">
    ${frets}
  </g>
  <g id="GUIDES" fill="none" stroke="#000000" stroke-width="0.01">
    ${center}
    ${nutline}
  </g>
</svg>`;

  return {svg,f14,length,endWidth};
}

function render(){
  const msg=$("message");
  try{
    const p=params();
    const r=buildSvg(p);
    lastSvg=r.svg;

    const parsed=new DOMParser().parseFromString(r.svg,"image/svg+xml");
    const node=document.importNode(parsed.documentElement,true);
    node.removeAttribute("width");
    node.removeAttribute("height");
    node.setAttribute("preserveAspectRatio","xMidYMid meet");

    $("preview").replaceWith(node);
    node.id="preview";

    $("s12").textContent=display(fretPos(p.scale,12));
    $("s14").textContent=display(r.f14);
    $("sLength").textContent=display(r.length);
    $("sEndWidth").textContent=display(r.endWidth);

    msg.className="ok";
    msg.textContent="Fretboard generated.";
  }catch(e){
    msg.className="error";
    msg.textContent=e.message;
  }
}

function download(){
  if(!lastSvg) render();
  if(!lastSvg) return;

  const blob=new Blob([lastSvg],{type:"image/svg+xml;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`Usonian_Fretboard_${$("scale").value}_${$("frets").value}frets.svg`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

$("generate").addEventListener("click",render);
$("download").addEventListener("click",download);

$("units").addEventListener("change",()=>{
  const toInches=$("units").value==="in";
  ["scale","nutWidth","width14","extension","overrun"].forEach(id=>{
    const el=$(id);
    const n=Number(el.value);
    if(!Number.isFinite(n)) return;
    el.value=(toInches?n/25.4:n*25.4).toFixed(toInches?4:2);
  });
  render();
});

render();
})();
</script>
</body>
</html>
